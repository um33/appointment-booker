services:
  db:
    image: postgres:16
    container_name: appointment_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appointment
    ports:
      - "5433:5432"
    volumes:
      - appointment_db_data:/var/lib/postgresql/data

volumes:
  appointment_db_data:
